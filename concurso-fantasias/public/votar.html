<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votação · Concurso de Fantasias bpone</title>
<meta name="theme-color" content="#080c20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/estatico/estilo.css">
</head>
<body>
<header class="hero"><div class="arte" role="img" aria-label="Arte de Halloween bpone: abóboras acesas sob a lua cheia"></div><div class="wrap"><h1>Concurso de Fantasias</h1><span>Halloween bpone · vote de 1 a 10</span></div></header>
<main class="wrap votar">
  <div id="aviso"></div>
  <div id="resultado" hidden></div>
  <div id="corpo"><div class="vazio"><h2>As fantasias já vêm aí</h2><p>Carregando as fotos…</p></div></div>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const S = { fantasias:[], notas:{}, aberta:true, participantes:null, slide:0, msg:"", msgErro:false,
    resultado:[], vendoFantasias:false, vistos:null };
  const pad = n => String(n).padStart(2,"0");

  async function api(url, opts){
    const r = await fetch(url, {credentials:"same-origin", headers:{"Content-Type":"application/json"}, ...opts});
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.erro || "Falha de conexão");
    return j;
  }

  function montar(){
    const total = S.fantasias.length;
    if(!total){ $("#corpo").innerHTML = `<div class="vazio"><h2>Nenhuma fantasia ainda</h2><p>As fotos aparecem aqui assim que forem publicadas.</p></div>`; return; }
    $("#corpo").innerHTML = `
      <div class="progresso"><span id="pr-txt"></span><span class="barra"><i id="pr-barra"></i></span><span id="pr-msg" class="salvo"></span></div>
      <div class="trilho" id="trilho" tabindex="0" aria-label="Fantasias">
        ${S.fantasias.map((f,i) => `
        <article class="slide" aria-label="Fantasia ${i+1} de ${total}">
          <div class="foto">
            <img src="${esc(f.url)}" alt="Foto da fantasia ${esc(f.nome)}" loading="${i<2?"eager":"lazy"}">
            <span class="num">${pad(i+1)} / ${pad(total)}</span>
            <span class="nota-dada" data-badge="${esc(f.id)}" hidden></span>
          </div>
          <div class="legenda"><h2>${esc(f.nome)}</h2>${f.participante?`<p>${esc(f.participante)}</p>`:""}</div>
          <div>
            <div class="notas" role="group" aria-label="Sua nota para ${esc(f.nome)}">
              ${Array.from({length:10},(_,k)=>`<button data-f="${esc(f.id)}" data-n="${k+1}" aria-pressed="false">${k+1}</button>`).join("")}
            </div>
            <div class="escala"><span>1 · Assustou pouco</span><span>10 · Arrepiante</span></div>
          </div>
        </article>`).join("")}
      </div>
      <div class="navega">
        <button class="seta" id="ant" aria-label="Fantasia anterior">‹</button>
        <div class="pontos" id="pontos">${S.fantasias.map((f,i)=>`<button data-i="${i}" aria-label="Ir para fantasia ${i+1}"></button>`).join("")}</div>
        <button class="seta" id="prox" aria-label="Próxima fantasia">›</button>
      </div>
      <div class="recado"><b id="rc-num">–</b><div><strong id="rc-txt">pessoas já votaram</strong><span>Os vencedores serão anunciados durante a festa e aparecem aqui nesta tela. Fique por perto!</span></div></div>`;
    const tr = $("#trilho"); let raf;
    tr.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
      const i = Math.round(tr.scrollLeft / (tr.clientWidth + 16)); if(i !== S.slide){ S.slide = i; atualizar(); }
    });});
    tr.addEventListener("keydown", e => { if(e.key==="ArrowRight") ir(S.slide+1); if(e.key==="ArrowLeft") ir(S.slide-1); });
    tr.addEventListener("click", e => { const b = e.target.closest("button[data-n]"); if(b) votar(b.dataset.f, +b.dataset.n); });
    $("#ant").onclick = () => ir(S.slide-1);
    $("#prox").onclick = () => ir(S.slide+1);
    $("#pontos").onclick = e => { const b = e.target.closest("button"); if(b) ir(+b.dataset.i); };
    // começa na primeira fantasia ainda sem nota
    const primeira = S.fantasias.findIndex(f => !S.notas[f.id]);
    requestAnimationFrame(() => ir(primeira < 0 ? 0 : primeira, true));
  }
  function ir(i, instant){
    const tr = $("#trilho"); if(!tr) return;
    i = Math.max(0, Math.min(S.fantasias.length-1, i)); S.slide = i;
    const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
    tr.scrollTo({left: i*(tr.clientWidth+16), behavior: (instant||reduz) ? "auto" : "smooth"});
    atualizar();
  }
  function avisos(){
    let a = "";
    if(S.resultado.length && S.vendoFantasias) a = `<div class="aviso alerta faixa-resultado"><span><strong>O resultado está saindo!</strong></span><button class="btn prim" id="ver-resultado">Ver resultado</button></div>`;
    else if(!S.aberta && !S.resultado.length) a = `<div class="aviso alerta"><strong>Votação encerrada.</strong> Obrigado por participar! O resultado será revelado aqui durante a festa.</div>`;
    $("#aviso").innerHTML = a;
    const b = $("#ver-resultado"); if(b) b.onclick = () => { S.vendoFantasias = false; renderResultado(); scrollTo(0,0); };
  }

  /* ---------- revelação do resultado ---------- */
  function renderResultado(){
    const box = $("#resultado");
    const mostrar = S.resultado.length > 0 && !S.vendoFantasias;
    box.hidden = !mostrar; $("#corpo").hidden = mostrar;
    avisos();
    if(!mostrar) return;
    const porPos = Object.fromEntries(S.resultado.map(r => [r.posicao, r]));
    const menor = Math.max(...S.resultado.map(r => r.posicao));
    const novos = S.vistos ? S.resultado.filter(r => !S.vistos.has(r.posicao)).map(r => r.posicao) : [];
    S.vistos = new Set(S.resultado.map(r => r.posicao));
    if(novos.length && navigator.vibrate) try{ navigator.vibrate([120,60,120]); }catch(_){}
    const linhas = [];
    for(let p = 1; p <= menor; p++){
      const r = porPos[p];
      linhas.push(r ? `
        <article class="colocado ${novos.includes(p) ? "novo" : ""}" data-p="${p}">
          <div class="foto"><img src="${esc(r.url)}" alt="Foto da fantasia ${esc(r.nome)}"></div>
          <div class="colocado-txt">
            <div class="pos">${p}º lugar</div>
            <h2>${esc(r.nome)}</h2>${r.participante ? `<p>${esc(r.participante)}</p>` : ""}
            <div class="media"><b>${r.media.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</b> de média · ${r.votos} ${r.votos===1?"voto":"votos"}</div>
          </div>
        </article>` : `
        <article class="colocado misterio" data-p="${p}">
          <div class="foto"><span>?</span></div>
          <div class="colocado-txt"><div class="pos">${p}º lugar</div><h2>Em instantes…</h2><p>Fique de olho na tela.</p></div>
        </article>`);
    }
    box.innerHTML = `<div class="revelacao">
      <div><h2 class="titulo">${porPos[1] ? "Temos um vencedor!" : "E o resultado é…"}</h2>
      <p class="sub">${S.participantes ?? ""} ${S.participantes===1?"pessoa votou":"pessoas votaram"}. Os colocados aparecem aqui conforme forem anunciados.</p></div>
      ${linhas.join("")}
      <button class="btn" id="ver-fantasias">Ver todas as fantasias</button>
    </div>`;
    $("#ver-fantasias").onclick = () => { S.vendoFantasias = true; renderResultado(); if(!$("#trilho")) montar(); atualizar(); scrollTo(0,0); };
  }
  function atualizar(){
    avisos();
    if(!$("#trilho")) return;
    const total = S.fantasias.length, feitos = S.fantasias.filter(f => S.notas[f.id]).length;
    $("#pr-txt").textContent = `${feitos} de ${total} avaliadas`;
    $("#pr-barra").style.width = (feitos/total*100) + "%";
    const m = $("#pr-msg"); m.textContent = S.msg; m.classList.toggle("erro", S.msgErro);
    document.querySelectorAll(".notas button").forEach(b => {
      b.setAttribute("aria-pressed", S.notas[b.dataset.f] === +b.dataset.n ? "true" : "false");
      b.disabled = !S.aberta;
    });
    document.querySelectorAll("[data-badge]").forEach(el => { const n = S.notas[el.dataset.badge]; el.hidden = !n; el.textContent = n || ""; });
    document.querySelectorAll("#pontos button").forEach((b,i) => {
      b.setAttribute("aria-current", i===S.slide ? "true" : "false");
      b.classList.toggle("votado", !!S.notas[S.fantasias[i].id]);
    });
    $("#ant").disabled = S.slide<=0; $("#prox").disabled = S.slide>=total-1;
    const np = S.participantes;
    $("#rc-num").textContent = np ?? "–";
    $("#rc-txt").textContent = np===1 ? "pessoa já votou" : "pessoas já votaram";
  }
  async function votar(fid, n){
    if(!S.aberta) return;
    const antes = S.notas[fid];
    S.notas[fid] = n; S.msg = "Salvando…"; S.msgErro = false; atualizar();
    const i = S.fantasias.findIndex(f => f.id===fid);
    setTimeout(() => {
      if(S.slide !== i) return;
      const p = S.fantasias.findIndex((f,k) => k>i && !S.notas[f.id]);
      if(p >= 0) ir(p); else if(i < S.fantasias.length-1) ir(i+1);
    }, 550);
    try{
      const r = await api("/api/votar", {method:"POST", body: JSON.stringify({fantasia:fid, nota:n})});
      S.participantes = r.participantes; S.msg = "✓ Nota salva";
    }catch(e){
      if(antes) S.notas[fid] = antes; else delete S.notas[fid];
      S.msg = e.message === "Falha de conexão" ? "Sem conexão. Toque na nota de novo." : e.message; S.msgErro = true;
      if(/encerrada/.test(e.message)) S.aberta = false;
    }
    atualizar();
  }
  function aplicarEstado(e){
    S.aberta = e.aberta; S.participantes = e.participantes;
    const antes = S.resultado.length;
    S.resultado = e.resultado || [];
    if(S.resultado.length > antes) S.vendoFantasias = false; // nova revelação: volta para o resultado
    renderResultado(); atualizar();
  }
  async function estado(){
    try{ aplicarEstado(await api("/api/estado")); }catch(_){}
  }
  (async () => {
    try{
      const [f, m, e] = await Promise.all([api("/api/fantasias"), api("/api/meus-votos"), api("/api/estado")]);
      S.fantasias = f; S.notas = {...m.notas};
      S.vistos = new Set((e.resultado || []).map(r => r.posicao)); // quem chega depois não recebe "novo" em tudo
      montar(); aplicarEstado(e);
    }catch(_){
      $("#corpo").innerHTML = `<div class="vazio"><h2>Não deu para carregar</h2><p>Confira sua conexão e recarregue a página.</p></div>`;
    }
    setInterval(estado, 4000);
  })();
})();
</script>
</body>
</html>
