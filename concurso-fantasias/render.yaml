services:
  - type: web
    name: concurso-fantasias
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: ADMIN_SENHA
        sync: false            # o Render pede para você digitar a senha na criação
      - key: DATABASE_URL
        fromDatabase:
          name: concurso-fantasias-db
          property: connectionString

databases:
  - name: concurso-fantasias-db
    plan: free
    databaseName: concurso
